<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurations - Generic Simulator</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">
                <h1>⚙️ Generic Simulator Portal</h1>
            </div>
            <ul class="nav-menu">
                <li><a href="../index.html">Home</a></li>
                <li><a href="configurations.html" class="active">Configurations</a></li>
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="visualizer.html">Process Flow</a></li>
            </ul>
        </div>
    </nav>

    <main class="container">
        <div class="card-header">
            <h2 class="card-title">Process Configurations</h2>
            <button class="btn btn-primary" onclick="createNewConfig()">+ New Configuration</button>
        </div>

        <div id="configList" style="margin-top: 2rem;">
            <div class="spinner"></div>
        </div>

        <div id="configViewer" style="display: none; margin-top: 2rem;">
            <div class="card">
                <div class="card-header">
                    <h3 id="configName">Configuration Details</h3>
                    <div>
                        <button class="btn btn-primary" onclick="editConfig()">Edit</button>
                        <button class="btn btn-outline" onclick="closeViewer()">Close</button>
                    </div>
                </div>
                <div class="card-body">
                    <div class="form-group">
                        <label class="form-label">Description:</label>
                        <p id="configDescription"></p>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Version:</label>
                        <p id="configVersion"></p>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Devices:</label>
                        <div id="devicesList"></div>
                    </div>
                    <div class="form-group" id="staffSection" style="display: none;">
                        <label class="form-label">Staff Requirements:</label>
                        <div id="staffList"></div>
                    </div>
                </div>
            </div>
        </div>

        <div id="configEditor" style="display: none; margin-top: 2rem;">
            <div class="card">
                <div class="card-header">
                    <h3>Configuration Editor</h3>
                    <div>
                        <button class="btn btn-success" onclick="saveConfiguration()">Save</button>
                        <button class="btn btn-secondary" onclick="validateConfiguration()">Validate</button>
                        <button class="btn btn-outline" onclick="closeEditor()">Cancel</button>
                    </div>
                </div>
                <div class="card-body">
                    <div id="editorMessages"></div>
                    <div class="form-group">
                        <label class="form-label">Configuration Name:</label>
                        <input type="text" id="editConfigName" class="form-input" placeholder="My Process">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Description:</label>
                        <textarea id="editConfigDescription" class="form-textarea" placeholder="Process description"></textarea>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Version:</label>
                        <input type="text" id="editConfigVersion" class="form-input" placeholder="1.0">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Configuration JSON:</label>
                        <textarea id="editConfigJSON" class="form-textarea" rows="20" style="font-family: monospace;"></textarea>
                        <small style="color: var(--text-light);">Edit the full configuration in JSON format. Make sure it's valid JSON.</small>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-content">
            <p>&copy; 2026 Generic Simulator Portal</p>
        </div>
    </footer>

    <script src="../js/api.js"></script>
    <script src="../js/configurations.js"></script>
</body>
</html>
